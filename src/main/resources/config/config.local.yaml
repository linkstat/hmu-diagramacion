# Plantilla para correr Aromito contra un PostgreSQL local.
# Para usarla, copiarla sobre config.yaml (en esta misma carpeta):
#
#   cp src/main/resources/config/config.local.yaml src/main/resources/config/config.yaml      (GNU/Linux)
#   copy src\main\resources\config\config.local.yaml src\main\resources\config\config.yaml    (Windows)
#
# Base y usuario de prueba: los que crea la sección «Puesta en marcha en otra
# PC» del README (base aromito, usuario aromito, contraseña aromito).
db:
  dbType: postgresql
  dbHost: localhost
  dbPort: 5432
  dbName: aromito
  dbUser: aromito
  dbPass: aromito

# Sin relay SMTP: los avisos se ven en la aplicación y no se envía correo.
smtp:
  host: ""
  port: 587
  from: "Aromito <noreply@hmu.com.ar>"
  auth: true
  tls: true
  username: ""
  password: ""
