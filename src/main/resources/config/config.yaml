# Archivo de configuración de Aromito
# las líneas que comienzan con # son comentarios,
# y no son leídas por el programa (solo humanos ;-)
#
# Configuración del entorno de demostración (credenciales de prueba).
# Para correr contra un PostgreSQL local, copiar config.local.yaml sobre
# este archivo (ver README).
#
db:
  dbType: postgresql
  dbHost: localhost
  dbPort: 5432
  dbName: aromito
  dbUser: aromito
  dbPass: aromitoSuperSecretDBPass

# Configuración SMTP para notificaciones por email (memorándums, novedades,
# diagramas). Si "host" queda en blanco, o si "auth" es true y "password"
# está vacío, el EmailNotificationService no envía correo.
smtp:
  host: "smtp-relay.brevo.com"
  port: 587
  from: "Aromito <noreply@hmu.com.ar>"
  auth: true
  tls: true
  username: "686776001@smtp-brevo.com"
  # Clave SMTP de Brevo: completar en el momento; sin clave, los avisos se ven
  # en pantalla y no se envía correo.
  password: ""
