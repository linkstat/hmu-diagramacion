# Archivo de configuración de HMU Diagramación.
# Las líneas que comienzan con # son comentarios.
#
# Configuración local lista para evaluar: PostgreSQL en esta misma PC con la
# base, el usuario y la contraseña que crea la guía de instalación del README.
#
db:
  dbType: postgresql
  dbHost: localhost
  dbPort: 5432
  dbName: hmu_diagramacion
  dbUser: hmu_diagramacion
  dbPass: hmu_diagramacion

# Notificaciones por correo (SMTP). Con "host" en blanco, o con "auth: true" y
# "password" en blanco, no se envía correo: los avisos se ven en la aplicación.
smtp:
  host: ""
  port: 587
  from: "HMU Diagramación <rrhh-no-responder@hmu.com.ar>"
  auth: true
  tls: true
  username: ""
  password: ""
