# Plantilla de configuración. Copiar a config.yaml (en esta misma carpeta)
# y completar los valores (config.yaml es el único archivo que lee la aplicación).
#
#   cp src/main/resources/config/config.example.yaml src/main/resources/config/config.yaml
#
db:
  dbType: postgresql
  dbHost: localhost
  dbPort: 5432
  dbName: hmu_diagramacion
  dbUser: hmu_diagramacion
  dbPass: ""

# Notificaciones por correo (SMTP). Con "host" en blanco, o con "auth: true" y
# "password" en blanco, no se envía correo: los avisos se ven en la aplicación.
# Ejemplo para un relay con STARTTLS: host "smtp.ejemplo.com", port 587,
# auth: true, tls: true. El remitente debe pertenecer a un dominio autenticado
# en el relay.
smtp:
  host: ""
  port: 587
  from: "HMU Diagramación <rrhh-no-responder@hmu.com.ar>"
  auth: true
  tls: true
  username: ""
  password: ""
